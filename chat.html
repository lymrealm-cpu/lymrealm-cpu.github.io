<script>
const SUPABASE_URL="https://probxnzduietjivnqrac.supabase.co";
const SUPABASE_KEY="sb_publishable_NfTpebCsTJMqaAsh89lfWA_pxv568kr";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let liveChannel=null;
let presenceChannel=null;
let onlineUserIds=[];
let profilesMap={};
let rolesMap={};
let mediaRecorder=null;
let audioStream=null;
let audioChunks=[];
let isRecording=false;
let isSendingVoice=false;
let chatStartedAt=null;
let appStarting=false;
let kickCheckInterval=null;
let kickBeingHandled=false;

function showStatus(message){
 document.getElementById("status").textContent=message;
}

function sessionStorageKey(userId){
 return "lym_chat_started_at_"+userId;
}

function timeValue(value){
 if(!value)return null;
 const result=new Date(value).getTime();
 return Number.isFinite(result)?result:null;
}

function saveChatSession(userId,value){
 if(userId&&value){
  localStorage.setItem(sessionStorageKey(userId),String(value));
 }
}

function stopKickChecker(){
 if(kickCheckInterval){
  clearInterval(kickCheckInterval);
  kickCheckInterval=null;
 }
}

async function removeChatChannels(){
 if(presenceChannel){
  const channel=presenceChannel;
  presenceChannel=null;
  try{await db.removeChannel(channel)}catch(e){}
 }
 if(liveChannel){
  const channel=liveChannel;
  liveChannel=null;
  try{await db.removeChannel(channel)}catch(e){}
 }
 onlineUserIds=[];
}

function stopRecordingWithoutSending(){
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  mediaRecorder.onstop=null;
  try{mediaRecorder.stop()}catch(e){}
 }
 mediaRecorder=null;
 isRecording=false;
 audioChunks=[];
 stopAudioTracks();

 const btn=document.getElementById("recordBtn");
 if(btn){
  btn.textContent="🎙️";
  btn.classList.remove("recording");
  btn.disabled=false;
 }
 const voiceStatus=document.getElementById("voiceStatus");
 if(voiceStatus)voiceStatus.textContent="";
}

async function showAuthMessage(message){
 stopKickChecker();
 stopRecordingWithoutSending();
 await removeChatChannels();

 try{await db.auth.signOut()}catch(e){}

 currentUser=null;
 chatStartedAt=null;
 profilesMap={};
 rolesMap={};

 document.getElementById("app").style.display="none";
 document.getElementById("auth").style.display="block";
 document.getElementById("logoutBtn").style.display="none";
 document.getElementById("messages").innerHTML="";
 showStatus(message);
}


// LOGIN

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  showStatus("Enter email and password.");
  return;
 }

 showStatus("Logging in...");

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){
  showStatus(error.message);
  return;
 }

 await startApp(data.user,true);
}


// SIGNUP

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  showStatus("Enter email and password.");
  return;
 }

 showStatus("Creating account...");

 const {data,error}=await db.auth.signUp({email,password});

 if(error){
  showStatus(error.message);
  return;
 }

 if(data.session){
  await startApp(data.user,true);
 }else{
  showStatus("Account created. Confirm your email, then login.");
 }
}


// ONLINE PRESENCE

async function setupPresence(){
 if(!currentUser)return;

 if(presenceChannel){
  await db.removeChannel(presenceChannel);
  presenceChannel=null;
 }

 onlineUserIds=[currentUser.id];

 presenceChannel=db.channel("lym-online-members",{
  config:{presence:{key:currentUser.id}}
 });

 presenceChannel.on("presence",{event:"sync"},()=>{
  const state=presenceChannel.presenceState();
  const ids=Object.values(state)
   .flat()
   .map(item=>item.user_id)
   .filter(Boolean);

  onlineUserIds=[...new Set(ids)];

  if(currentUser&&document.getElementById("app").style.display==="grid"){
   loadMembers();
  }
 });

 await new Promise(resolve=>{
  let finished=false;
  const finish=()=>{
   if(finished)return;
   finished=true;
   resolve();
  };

  const timeout=setTimeout(finish,8000);

  presenceChannel.subscribe(async status=>{
   if(status==="SUBSCRIBED"){
    const {error}=await presenceChannel.track({
     user_id:currentUser.id
    });
    if(error)showStatus("Online status error: "+error.message);
    clearTimeout(timeout);
    finish();
   }

   if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
    showStatus("Online status connection problem. Please refresh.");
    clearTimeout(timeout);
    finish();
   }
  });
 });
}


// BAN CHECK

async function checkBanStatus(){
 const {data,error}=await db.rpc("is_my_account_banned");

 if(error){
  await showAuthMessage("Account verification failed. Please try again. "+error.message);
  return false;
 }

 if(data===true){
  await showAuthMessage("Your account is banned by Admin. Contact Super Admin.");
  return false;
 }

 return true;
}


// KICK DETECTION

async function handleKicked(){
 if(kickBeingHandled)return;
 kickBeingHandled=true;

 await showAuthMessage(
  "You were kicked by Super Admin. You may log in again."
 );

 kickBeingHandled=false;
}

async function checkKickStatus(){
 if(!currentUser||!chatStartedAt||kickBeingHandled)return;

 const userId=currentUser.id;
 const originalTime=timeValue(chatStartedAt);

 const {data,error}=await db.rpc("get_my_chat_started_at");

 if(error){
  return;
 }

 if(!currentUser||currentUser.id!==userId)return;

 const serverTime=timeValue(data);

 if(serverTime===null||originalTime===null)return;

 if(serverTime!==originalTime){
  await handleKicked();
 }
}

function startKickChecker(){
 stopKickChecker();

 kickCheckInterval=setInterval(()=>{
  checkKickStatus();
 },4000);
}


// START APP

async function startApp(user,isNewLogin=false){
 if(appStarting)return;
 appStarting=true;

 try{
  // Ban check happens before chat opens.
  const allowed=await checkBanStatus();
  if(!allowed)return;

  currentUser=user;

  if(isNewLogin){
   const {data,error}=await db.rpc("start_fresh_chat");

   if(error){
    await showAuthMessage("Chat start error: "+error.message);
    return;
   }

   chatStartedAt=data;
   saveChatSession(user.id,chatStartedAt);

  }else{
   const {data,error}=await db.rpc("get_my_chat_started_at");

   if(error){
    await showAuthMessage("Chat session error: "+error.message);
    return;
   }

   chatStartedAt=data;

   if(!chatStartedAt){
    const result=await db.rpc("start_fresh_chat");

    if(result.error){
     await showAuthMessage("Chat start error: "+result.error.message);
     return;
    }

    chatStartedAt=result.data;
   }

   // Detect a kick even if the user refreshed the page.
   const previousTime=localStorage.getItem(sessionStorageKey(user.id));

   if(previousTime){
    const oldValue=timeValue(previousTime);
    const newValue=timeValue(chatStartedAt);

    if(oldValue!==null&&newValue!==null&&oldValue!==newValue){
     await handleKicked();
     return;
    }
   }

   saveChatSession(user.id,chatStartedAt);
  }

  if(!chatStartedAt){
   await showAuthMessage("Chat session could not be started. Please login again.");
   return;
  }

  const username="user_"+user.id.replaceAll("-","").substring(0,8);

  const {error:profileError}=await db.from("profiles").upsert(
   {id:user.id,username:username},
   {onConflict:"id",ignoreDuplicates:true}
  );

  if(profileError){
   await showAuthMessage("Profile error: "+profileError.message);
   return;
  }

  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="grid";
  document.getElementById("logoutBtn").style.display="block";

  document.getElementById("messages").innerHTML=
   '<div class="system-message">Welcome to your fresh LYM REALM chat!</div>';

  await setupPresence();

  if(!currentUser)return;

  await loadMembers();
  await loadMessages();

  if(!currentUser)return;

  if(liveChannel){
   await db.removeChannel(liveChannel);
  }

  liveChannel=db.channel("lym-public-group-chat")
  .on("postgres_changes",{
   event:"INSERT",
   schema:"public",
   table:"messages"
  },payload=>{
   if(payload.new.receiver_id===null&&currentUser){
    loadMessages();
   }
  })
  .subscribe();

  startKickChecker();

 }finally{
  appStarting=false;
 }
}


// LOAD MEMBERS

async function loadMembers(){
 if(!currentUser)return;

 const box=document.getElementById("users");
 box.textContent="Loading online members...";

 const {data:profiles,error}=await db.from("profiles")
 .select("id,username");

 if(error){
  box.textContent="Profile error: "+error.message;
  return;
 }

 const {data:roles,error:roleError}=await db
 .from("user_roles").select("user_id,role");

 if(roleError){
  box.textContent="Role error: "+roleError.message;
  return;
 }

 profilesMap={};
 rolesMap={};

 (profiles||[]).forEach(p=>profilesMap[p.id]=p.username);
 (roles||[]).forEach(r=>rolesMap[r.user_id]=r.role);

 const priority={super_admin:1,moderator:2,vip:3,member:4};

 const onlineProfiles=(profiles||[]).filter(p=>
  onlineUserIds.includes(p.id)
 );

 onlineProfiles.sort((a,b)=>{
  const roleA=priority[rolesMap[a.id]||"member"]||4;
  const roleB=priority[rolesMap[b.id]||"member"]||4;
  return roleA-roleB||(a.username||"").localeCompare(b.username||"");
 });

 const myUsername=profilesMap[currentUser.id]||"Member";
 const myRole=rolesMap[currentUser.id]||"member";

 document.getElementById("myname").textContent=myUsername;
 document.getElementById("myrole").textContent=
  myRole==="super_admin"?"👑 SUPER ADMIN":
  myRole==="moderator"?"🛡️ MODERATOR":
  myRole==="vip"?"⭐ VIP MEMBER":"MEMBER";

 box.innerHTML="";
 document.getElementById("onlineCount").textContent=
  onlineProfiles.length+" Online";

 if(!onlineProfiles.length){
  box.textContent="No online members.";
  return;
 }

 onlineProfiles.forEach(p=>{
  const role=rolesMap[p.id]||"member";
  const b=document.createElement("div");
  b.className="member"+(p.id===currentUser.id?" me":"");

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=
   role==="super_admin"?"👑":
   role==="moderator"?"🛡️":
   role==="vip"?"⭐":"👤";

  const info=document.createElement("div");
  info.className="member-info";

  const name=document.createElement("div");
  name.className="member-name";
  name.textContent=p.username||"Member";

  const dot=document.createElement("span");
  dot.className="online-dot";
  name.prepend(dot);

  const roleText=document.createElement("div");
  roleText.className="member-role";
  roleText.textContent=
   role==="super_admin"?"SUPER ADMIN":
   role==="moderator"?"MODERATOR":
   role==="vip"?"VIP MEMBER":"MEMBER";

  info.append(name,roleText);
  b.append(avatar,info);
  box.appendChild(b);
 });
}


// CHANGE USERNAME

async function changeUsername(){
 const input=document.getElementById("newUsername");
 const username=input.value.trim();

 if(username.length<3||username.length>20){
  alert("Username must be 3 to 20 characters.");
  return;
 }

 if(!/^[A-Za-z0-9_]+$/.test(username)){
  alert("Use only letters, numbers and underscores.");
  return;
 }

 const {error}=await db.rpc("update_my_username",{
  p_username:username
 });

 if(error){
  alert(error.message);
  return;
 }

 input.value="";
 alert("Username updated successfully!");

 await loadMembers();
 await loadMessages();
}


// LOAD CURRENT SESSION MESSAGES

async function loadMessages(){
 const box=document.getElementById("messages");

 if(!chatStartedAt||!currentUser)return;

 const {data,error}=await db.from("messages")
 .select("id,sender_id,receiver_id,message,created_at,message_type,audio_path")
 .is("receiver_id",null)
 .gte("created_at",chatStartedAt)
 .order("created_at",{ascending:true})
 .limit(300);

 if(error){
  box.innerHTML="";
  box.textContent="Message error: "+error.message;
  return;
 }

 box.innerHTML="";

 if(!data||data.length===0){
  box.innerHTML=
   '<div class="system-message">No new messages. Start your fresh conversation!</div>';
  return;
 }

 for(const m of data){
  if(!currentUser)return;

  const div=document.createElement("div");
  div.className="msg "+(m.sender_id===currentUser.id?"mine":"");

  const sender=document.createElement("div");
  sender.className="sender";

  const senderRole=rolesMap[m.sender_id]||"member";
  const senderName=profilesMap[m.sender_id]||"Member";

  sender.textContent=
   (senderRole==="super_admin"?"👑 ":
    senderRole==="moderator"?"🛡️ ":
    senderRole==="vip"?"⭐ ":"")+senderName;

  div.appendChild(sender);

  if(m.message_type==="voice"&&m.audio_path){
   const audio=document.createElement("audio");
   audio.controls=true;
   audio.preload="none";

   const {data:urlData,error:urlError}=await db.storage
    .from("voice-messages")
    .createSignedUrl(m.audio_path,3600);

   if(urlError){
    const errorText=document.createElement("div");
    errorText.textContent="Voice unavailable";
    div.appendChild(errorText);
   }else{
    audio.src=urlData.signedUrl;
    div.appendChild(audio);
   }
  }else{
   const content=document.createElement("div");
   content.textContent=m.message;
   div.appendChild(content);
  }

  const time=document.createElement("div");
  time.className="time";
  time.textContent=new Date(m.created_at).toLocaleString([],{
   month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"
  });

  div.appendChild(time);
  box.appendChild(div);
 }

 box.scrollTop=box.scrollHeight;
}


// SEND TEXT MESSAGE

async function sendMessage(){
 const input=document.getElementById("message");
 const message=input.value.trim();

 if(!message||!currentUser)return;

 const sendButton=document.getElementById("sendBtn");
 sendButton.disabled=true;

 try{
  const {error}=await db.rpc("send_group_message",{
   p_message:message
  });

  if(error){
   if(error.message.toLowerCase().includes("banned")){
    await showAuthMessage("Your account is banned by Admin. Contact Super Admin.");
   }else{
    alert(error.message);
   }
   return;
  }

  input.value="";
  await loadMessages();

 }catch(error){
  alert("Message error: "+error.message);
 }finally{
  sendButton.disabled=false;
 }
}


// START VOICE RECORDING

async function startRecording(){
 if(!currentUser)return;

 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  alert("Microphone is not supported. Open the website in Chrome using HTTPS.");
  return;
 }

 if(!window.MediaRecorder){
  alert("Voice recording is not supported in this browser.");
  return;
 }

 try{
  audioStream=await navigator.mediaDevices.getUserMedia({audio:true});

  let options={};
  if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
   options.mimeType="audio/webm;codecs=opus";
  }else if(MediaRecorder.isTypeSupported("audio/webm")){
   options.mimeType="audio/webm";
  }

  mediaRecorder=new MediaRecorder(audioStream,options);
  audioChunks=[];

  mediaRecorder.ondataavailable=event=>{
   if(event.data&&event.data.size>0){
    audioChunks.push(event.data);
   }
  };

  mediaRecorder.onstop=async()=>{
   const blob=new Blob(audioChunks,{
    type:mediaRecorder.mimeType||"audio/webm"
   });

   stopAudioTracks();

   if(blob.size===0){
    document.getElementById("voiceStatus").textContent="";
    return;
   }

   if(currentUser)await uploadVoice(blob);
  };

  mediaRecorder.start();
  isRecording=true;

  const btn=document.getElementById("recordBtn");
  btn.textContent="⏹ Stop";
  btn.classList.add("recording");

  document.getElementById("voiceStatus").textContent=
   "🔴 Recording... Press Stop to send your voice.";

 }catch(error){
  stopAudioTracks();
  alert("Microphone error: "+error.message);
 }
}


// STOP RECORDING

function stopRecording(){
 if(mediaRecorder&&isRecording){
  isRecording=false;
  mediaRecorder.stop();

  const btn=document.getElementById("recordBtn");
  btn.textContent="🎙️";
  btn.classList.remove("recording");

  document.getElementById("voiceStatus").textContent=
   "Uploading voice message...";
 }
}


// RECORD BUTTON

async function toggleRecording(){
 if(isSendingVoice)return;

 if(isRecording){
  stopRecording();
 }else{
  await startRecording();
 }
}


// STOP MICROPHONE

function stopAudioTracks(){
 if(audioStream){
  audioStream.getTracks().forEach(track=>track.stop());
  audioStream=null;
 }
}


// UPLOAD AND SEND VOICE

async function uploadVoice(blob){
 if(isSendingVoice||!currentUser)return;

 isSendingVoice=true;

 const status=document.getElementById("voiceStatus");
 const btn=document.getElementById("recordBtn");

 btn.disabled=true;

 try{
  const extension="webm";
  const path=currentUser.id+"/"+Date.now()+"."+extension;

  const {error:uploadError}=await db.storage
   .from("voice-messages")
   .upload(path,blob,{
    contentType:"audio/webm",
    upsert:false
   });

  if(uploadError)throw uploadError;

  const {error:sendError}=await db.rpc("send_group_voice_message",{
   p_audio_path:path
  });

  if(sendError){
   await db.storage.from("voice-messages").remove([path]);

   if(sendError.message.toLowerCase().includes("banned")){
    await showAuthMessage("Your account is banned by Admin. Contact Super Admin.");
    return;
   }

   throw sendError;
  }

  status.textContent="Voice message sent!";
  await loadMessages();

 }catch(error){
  alert("Voice upload error: "+error.message);
  status.textContent="Voice message failed.";
 }finally{
  isSendingVoice=false;
  btn.disabled=false;

  setTimeout(()=>{
   if(!isRecording){
    status.textContent="";
   }
  },3000);
 }
}


// LOGOUT

async function logout(){
 const userId=currentUser?.id;

 stopKickChecker();
 stopRecordingWithoutSending();
 await removeChatChannels();

 if(userId){
  localStorage.removeItem(sessionStorageKey(userId));
 }

 try{await db.auth.signOut()}catch(e){}

 currentUser=null;
 chatStartedAt=null;
 profilesMap={};
 rolesMap={};

 location.reload();
}


// SESSION CHECK

db.auth.getSession().then(async({data,error})=>{
 if(error){
  showStatus(error.message);
  return;
 }

 if(data.session){
  await startApp(data.session.user,false);
 }
});
</script>
