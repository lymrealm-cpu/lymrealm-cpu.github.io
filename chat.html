<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYM REALM | PUBLIC CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#061713;color:white;font-family:Arial,sans-serif}button,input{font:inherit}
header{height:80px;background:#006b43;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:2px solid #00d98b}
.logo{font-size:25px;font-weight:bold}.sub{font-size:12px;color:#c8ffe6;margin-top:5px}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#00a96b;color:white;font-weight:bold}button:hover{background:#00c982}button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:12px;border:1px solid #28584a;border-radius:9px;background:#10251f;color:white;margin:6px 0;outline:none}
#auth{max-width:420px;margin:60px auto;padding:25px;background:#102b25;border-radius:18px}#auth button{width:100%;margin-top:8px}#status{color:#aaffd2;font-size:13px}
#app{display:none;height:calc(100vh - 80px);grid-template-columns:290px 1fr}.sidebar{background:#09221c;padding:14px;border-right:1px solid #087b55;overflow:auto}
.profile{padding:12px;background:#102e25;border-radius:12px;margin-bottom:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#087c53;display:grid;place-items:center;font-size:23px;border:2px solid #00e995;flex-shrink:0}
.myrow{display:flex;align-items:center;gap:12px}.green{color:#00ed87}.muted{color:#9bb6ad;font-size:12px}.editbox{margin-top:12px;padding-top:10px;border-top:1px solid #31564a}.editbox button{width:100%}
.section-title{font-size:14px;color:#00ed87;margin:17px 4px 8px}#onlineCount{color:#00ed87;font-size:11px;margin-left:5px}
.online-dot{display:inline-block;width:8px;height:8px;background:#00ed87;border-radius:50%;margin-right:6px;box-shadow:0 0 7px #00ed87;vertical-align:middle}
.member{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:#142e28;margin:5px 0;padding:9px;border:1px solid transparent;border-radius:9px}.member.me{border-color:#00b978}.member .avatar{width:36px;height:36px;font-size:17px}
.member-info{min-width:0;flex:1}.member-name{font-size:13px;font-weight:bold;overflow-wrap:anywhere}.member-role{font-size:10px;color:#ffd76a;margin-top:3px}
.chat{display:flex;flex-direction:column;min-width:0}.chathead{min-height:70px;background:#09221c;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #087b55}.chathead .avatar{width:43px;height:43px}
#messages{flex:1;overflow:auto;padding:18px;background-color:#071c17;background-image:radial-gradient(#173b30 1px,transparent 1px);background-size:22px 22px}
.msg{max-width:75%;width:fit-content;background:#263c38;border-radius:14px;padding:10px 13px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:#007e50}
.sender{font-size:12px;font-weight:bold;color:#ffd76a;margin-bottom:6px}.msg.mine .sender{color:#aaffd2}.time{font-size:10px;color:#c1d8cf;text-align:right;margin-top:7px}
.msg audio{display:block;width:min(270px,65vw);max-width:100%;margin-top:8px}.system-message{text-align:center;color:#9bb6ad;font-size:12px;margin:15px}
.composer{display:flex;gap:9px;padding:12px;background:#09221c;align-items:center}.composer input{margin:0;flex:1;min-width:0}.composer button{min-width:65px}
#recordBtn{background:#a52e38}#recordBtn.recording{background:#e00035;animation:pulse 1s infinite}#voiceStatus{font-size:11px;color:#aaffd2;padding:0 12px 8px;background:#09221c}
@keyframes pulse{50%{opacity:.55}}
#welcomeScreen{display:none;position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#061713,#0b3024);align-items:center;justify-content:center;padding:15px;overflow-y:auto}
.welcome-card{width:100%;max-width:520px;background:#102b25;border:1px solid #00a96b;border-radius:20px;padding:24px;box-shadow:0 0 30px #003d2b}
.welcome-logo{text-align:center;color:#f5d477;font-size:30px;font-weight:bold}.welcome-sub{text-align:center;color:#a8d8c5;font-size:11px;margin-top:7px}
.rules-title{color:#f5d477;font-size:19px;margin:22px 0 13px}.rule{display:flex;gap:10px;margin:12px 0;color:white;font-size:14px;line-height:1.5}.rule-number{color:#f5d477;font-weight:bold;min-width:20px}
.welcome-footer{text-align:center;color:#a8d8c5;font-size:12px;margin:20px 0}#enterChatBtn{width:100%;padding:15px;border-radius:12px;background:#d7b65c;color:#10251d;font-size:17px;font-weight:bold}#enterChatBtn:hover{background:#f5d477}
.voice-room{background:#0b2b22;border-bottom:1px solid #087b55;padding:10px 14px}.voice-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.voice-title{font-weight:bold;color:#f5d477}.voice-state{font-size:12px;color:#aaffd2;flex:1;min-width:130px}
.voice-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.voice-actions button{padding:8px 10px;font-size:12px}.voice-actions .danger{background:#a52e38}.voice-actions .gold{background:#a78328;color:#fff}
#micRequests{font-size:12px;color:#d8eee5;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.request-item{background:#173d30;border:1px solid #287b59;border-radius:8px;padding:6px 8px;display:flex;gap:7px;align-items:center}.request-item button{padding:5px 8px;font-size:11px}
@media(max-width:650px){header{height:70px;padding:10px}.logo{font-size:18px}#app{height:calc(100vh - 70px);grid-template-columns:112px 1fr}.sidebar{padding:6px}.profile{padding:7px}.myrow{display:block;text-align:center}.profile .avatar{margin:auto;width:38px;height:38px;font-size:18px}.profile .muted{font-size:9px;margin-top:5px}#myname{font-size:11px;overflow-wrap:anywhere}.editbox{padding-top:6px}.editbox input{padding:7px;font-size:10px}.editbox button{padding:7px 2px;font-size:10px}.section-title{font-size:11px;margin:12px 2px 6px}#onlineCount{font-size:9px;margin-left:2px}.member{display:block;text-align:center;padding:7px 2px}.member .avatar{width:30px;height:30px;margin:auto;font-size:15px}.member-name{font-size:10px;margin-top:4px}.member-role{font-size:8px;overflow-wrap:anywhere}.chathead{min-height:60px;padding:8px}.chathead .avatar{width:36px;height:36px}#messages{padding:8px}.msg{max-width:92%;font-size:13px;padding:9px}.composer{padding:7px;gap:5px}.composer button{padding:10px 7px;min-width:45px;font-size:12px}.composer input{font-size:13px}.welcome-card{padding:19px}.welcome-logo{font-size:26px}.rule{font-size:13px;margin:11px 0}.voice-room{padding:8px}.voice-actions button{font-size:10px;padding:7px}.voice-state{font-size:11px}}
</style>
</head>
