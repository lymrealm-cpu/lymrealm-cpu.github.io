
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYM REALM CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#101820;color:white;font-family:Arial}
header{background:#075e54;padding:18px;font-size:22px;font-weight:bold}
#auth,#app{padding:15px}
input{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:0}
button{padding:12px;margin:5px;border:0;border-radius:7px;background:#128c7e;color:white}
#users button{display:block;width:100%;text-align:left;background:#263b46;padding:15px}
#messages{height:45vh;overflow-y:auto;padding:10px;background:#17232d}
.msg{background:#075e54;padding:10px;margin:8px 0;border-radius:10px;max-width:80%;margin-left:auto}
.other{background:#344955;margin-left:0}
#chatbox{display:flex;gap:5px}
#chatbox input{flex:1}
.hidden{display:none}
</style>
</head>
<body>

<header>LYM REALM CHAT</header>

<div id="auth">
<h3>Login / Create Account</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<p id="status"></p>
</div>

<div id="app" class="hidden">
<p id="myname"></p>
<button onclick="logout()">Logout</button>

<h3>Users</h3>
<div id="users">Loading users...</div>

<h3 id="chatTitle">Select a user to chat</h3>
<div id="messages"></div>

<div id="chatbox">
<input id="message" placeholder="Write a message...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let selectedUser = null;
let chatChannel = null;

const statusBox = document.getElementById("status");

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 statusBox.textContent="Logging in...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){statusBox.textContent=error.message;return;}
 await startApp(data.user);
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 statusBox.textContent="Creating account...";
 const {data,error}=await db.auth.signUp({email,password});
 if(error){statusBox.textContent=error.message;return;}
 if(data.session){
   await startApp(data.user);
 }else{
   statusBox.textContent="Account created. Check your email for confirmation, then login.";
 }
}

async function startApp(user){
 currentUser=user;
 const username="user_"+user.id.replaceAll("-","").substring(0,8);

 const {error:profileError}=await db.from("profiles").upsert(
   {id:user.id,username:username},
   {onConflict:"id",ignoreDuplicates:true}
 );

 if(profileError){
   statusBox.textContent="Profile error: "+profileError.message;
   return;
 }

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("myname").textContent="Your ID: "+username;

 await loadUsers();

 if(chatChannel) await db.removeChannel(chatChannel);
 chatChannel=db.channel("live-messages")
 .on("postgres_changes",
   {event:"INSERT",schema:"public",table:"messages"},
   ()=>{if(selectedUser) loadMessages();}
 ).subscribe();
}

async function loadUsers(){
 const {data,error}=await db.from("profiles")
 .select("id,username")
 .neq("id",currentUser.id)
 .order("username");

 const box=document.getElementById("users");
 box.innerHTML="";

 if(error){box.textContent=error.message;return;}
 if(!data || data.length===0){
   box.textContent="No other users yet. Create another account to test chat.";
   return;
 }

 data.forEach(user=>{
   const button=document.createElement("button");
   button.textContent=user.username;
   button.onclick=()=>openChat(user);
   box.appendChild(button);
 });
}

async function openChat(user){
 selectedUser=user;
 document.getElementById("chatTitle").textContent="Chat with "+user.username;
 await loadMessages();
}

async function loadMessages(){
 if(!selectedUser)return;

 const {data,error}=await db.from("messages")
 .select("id,sender_id,receiver_id,message,created_at")
 .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
 .order("created_at",{ascending:true});

 const box=document.getElementById("messages");
 box.innerHTML="";

 if(error){box.textContent=error.message;return;}

 data.filter(m=>
   (m.sender_id===currentUser.id && m.receiver_id===selectedUser.id) ||
   (m.sender_id===selectedUser.id && m.receiver_id===currentUser.id)
 ).forEach(m=>{
   const div=document.createElement("div");
   div.className="msg "+(m.sender_id===currentUser.id?"":"other");
   div.textContent=m.message;
   box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
 if(!selectedUser){alert("Select a user first");return;}

 const input=document.getElementById("message");
 const message=input.value.trim();
 if(!message)return;

 const {error}=await db.from("messages").insert({
   sender_id:currentUser.id,
   receiver_id:selectedUser.id,
   message:message
 });

 if(error){alert(error.message);return;}
 input.value="";
 await loadMessages();
}

async function logout(){
 if(chatChannel) await db.removeChannel(chatChannel);
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session) startApp(data.session.user);
});
</script>
</body>
</html>
