
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYM REALM CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061713;color:white;font-family:Arial,sans-serif}
button,input{font:inherit}
header{height:95px;background:#006b43;display:flex;align-items:center;
justify-content:space-between;padding:15px 25px;border-bottom:2px solid #00d98b}
.logo{font-size:27px;font-weight:bold;letter-spacing:1px}
.sub{font-size:13px;color:#c8ffe6;margin-top:5px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;
background:#00a96b;color:white;font-weight:bold}
button:hover{background:#00c982}
#auth{max-width:420px;margin:70px auto;padding:25px;background:#102b25;border-radius:18px}
input{width:100%;padding:14px;border:1px solid #28584a;border-radius:10px;
background:#10251f;color:white;margin:7px 0;outline:none}
#auth button{margin:5px 0;width:100%}
#status{color:#aaffd2}
#app{display:none;height:calc(100vh - 95px);grid-template-columns:340px 1fr}
.sidebar{background:#09221c;padding:18px;border-right:1px solid #087b55;overflow:auto}
.profile{display:flex;align-items:center;gap:15px;padding:10px 5px 22px;
border-bottom:1px solid #31564a;margin-bottom:20px}
.avatar{width:65px;height:65px;border-radius:50%;background:#087c53;
display:grid;place-items:center;font-size:27px;border:2px solid #00e995}
.muted{color:#9bb6ad;font-size:13px}
.green{color:#00ed87}
.user{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
background:#142e28;margin:7px 0;padding:14px;border:1px solid transparent}
.user.active{border:2px solid #00e995;box-shadow:0 0 12px #00a96b}
.dot{width:11px;height:11px;border-radius:50%;background:#00ed87;display:inline-block}
.chat{display:flex;flex-direction:column;min-width:0}
.chathead{height:85px;background:#09221c;display:flex;align-items:center;
gap:15px;padding:15px 22px;border-bottom:1px solid #087b55}
.chathead .avatar{width:52px;height:52px}
#messages{flex:1;overflow:auto;padding:20px;background-color:#071c17;
background-image:radial-gradient(#173b30 1px,transparent 1px);
background-size:22px 22px}
.msg{max-width:75%;width:fit-content;background:#263c38;border-radius:16px;
padding:12px 15px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{margin-left:auto;background:#007e50}
.time{font-size:10px;color:#c1d8cf;text-align:right;margin-top:7px}
.composer{display:flex;gap:10px;padding:14px;background:#09221c}
.composer input{margin:0;flex:1}
.composer button{min-width:75px}
.hidden{display:none}
@media(max-width:650px){
 header{height:75px;padding:12px}
 .logo{font-size:19px}
 #app{height:calc(100vh - 75px);grid-template-columns:115px 1fr}
 .sidebar{padding:8px}
 .profile{display:block;text-align:center}
 .profile .avatar{margin:auto;width:48px;height:48px}
 .profile .details{font-size:10px;overflow-wrap:anywhere;margin-top:8px}
 .user{padding:10px 3px;display:block;text-align:center;font-size:11px}
 .user .avatar{width:35px;height:35px;margin:0 auto 5px;font-size:17px}
 .user .dot{width:8px;height:8px}
 .chathead{height:70px;padding:9px}
 .chathead .avatar{width:40px;height:40px}
 #messages{padding:10px}
 .msg{max-width:90%;font-size:14px}
 .composer{padding:8px;gap:5px}
 .composer input{min-width:0}
 .composer button{padding:10px}
}
</style>
</head>
<body>

<header>
 <div>
  <div class="logo">♛ LYM REALM CHAT</div>
  <div class="sub">CONNECT • CHAT • SHARE</div>
 </div>
 <button id="logoutBtn" onclick="logout()" style="display:none">Logout</button>
</header>

<div id="auth">
 <h2>Welcome to LYM REALM</h2>
 <input id="email" type="email" placeholder="Email address">
 <input id="password" type="password" placeholder="Password">
 <button onclick="login()">Login</button>
 <button onclick="signup()">Create Account</button>
 <p id="status"></p>
</div>

<div id="app">
 <aside class="sidebar">
  <div class="profile">
   <div class="avatar">👑</div>
   <div class="details">
    <div class="muted">Your ID</div>
    <div id="myname" class="green">Loading...</div>
   </div>
  </div>
  <h3>♟ Users</h3>
  <div id="users">Loading users...</div>
 </aside>

 <main class="chat">
  <div class="chathead">
   <div class="avatar">👑</div>
   <div>
    <strong id="chatTitle">Select a user</strong>
    <div class="muted">LYM REALM CHAT</div>
   </div>
  </div>
  <div id="messages">
   <p class="muted">Choose a user to start chatting.</p>
  </div>
  <div class="composer">
   <input id="message" placeholder="Type a message..."
    onkeydown="if(event.key==='Enter')sendMessage()">
   <button onclick="sendMessage()">Send</button>
  </div>
 </main>
</div>

<script>
const SUPABASE_URL = "https://probxnzduietjivnqrac.supabase.co";
const SUPABASE_KEY = "sb_publishable_NfTpebCsTJMqaAsh89lfWA_pxv568kr";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let selectedUser=null;
let liveChannel=null;

function showStatus(message){
 document.getElementById("status").textContent=message;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 showStatus("Logging in...");
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){showStatus(error.message);return;}
 await startApp(data.user);
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 showStatus("Creating account...");
 const {data,error}=await db.auth.signUp({email,password});
 if(error){showStatus(error.message);return;}
 if(data.session) await startApp(data.user);
 else showStatus("Account created. Confirm your email, then login.");
}

async function startApp(user){
 currentUser=user;
 const username="user_"+user.id.replaceAll("-","").substring(0,8);

 const {error}=await db.from("profiles").upsert(
  {id:user.id,username:username},
  {onConflict:"id",ignoreDuplicates:true}
 );

 if(error){showStatus("Profile error: "+error.message);return;}

 document.getElementById("auth").style.display="none";
 document.getElementById("app").style.display="grid";
 document.getElementById("logoutBtn").style.display="block";
 document.getElementById("myname").textContent=username;

 await loadUsers();

 if(liveChannel) await db.removeChannel(liveChannel);
 liveChannel=db.channel("lym-live-chat")
 .on("postgres_changes",
 {event:"INSERT",schema:"public",table:"messages"},
 payload=>{
  const m=payload.new;
  if(selectedUser &&
    ((m.sender_id===currentUser.id && m.receiver_id===selectedUser.id) ||
     (m.sender_id===selectedUser.id && m.receiver_id===currentUser.id))){
       loadMessages();
  }
 }).subscribe();
}


async function loadUsers(){
 const box=document.getElementById("users");
 box.textContent="Loading...";

 const {data,error}=await db.from("profiles")
  .select("id,username")
  .neq("id",currentUser.id)
  .order("username");

 if(error){
  box.textContent=error.message;
  return;
 }

 const {data:roles,error:roleError}=await db
  .from("user_roles")
  .select("user_id,role");

 if(roleError){
  box.textContent=roleError.message;
  return;
 }

 const roleMap={};
 (roles||[]).forEach(r=>{
  roleMap[r.user_id]=r.role;
 });

 box.innerHTML="";

 if(!data || data.length===0){
  box.textContent="No other users yet.";
  return;
 }

 data.forEach(u=>{
  const b=document.createElement("button");
  b.className="user";

  if(selectedUser && selectedUser.id===u.id){
   b.classList.add("active");
  data.forEach(u=>{

  const avatar=document.createElement("span");
  avatar.className="avatar";
  avatar.textContent="👤";

  const name=document.createElement("span");
  name.textContent=u.username;

  const role=document.createElement("span");
  const userRole=roleMap[u.id]||"member";

  role.textContent=
   userRole==="super_admin" ? " 👑 SUPER ADMIN" :
   userRole==="moderator" ? " 🛡️ MOD" :
   userRole==="vip" ? " ⭐ VIP" : "";

  role.style.fontSize="10px";
  role.style.color="#ffd76a";

  b.append(avatar,name,role);
  b.onclick=()=>openChat(u);
  box.appendChild(b);
 });
}

  const b=document.createElement("button");
  b.className="user";
  if(selectedUser && selectedUser.id===u.id)b.classList.add("active");

  const avatar=document.createElement("span");
  avatar.className="avatar";
  avatar.textContent="👤";

  const name=document.createElement("span");
  name.textContent=u.username;

  b.append(avatar,name);
  b.onclick=()=>openChat(u);
  box.appendChild(b);
 });
}

async function openChat(user){
 selectedUser=user;
 document.getElementById("chatTitle").textContent=user.username;
 await loadUsers();
 await loadMessages();
}

async function loadMessages(){
 if(!selectedUser)return;
 const box=document.getElementById("messages");
 const {data,error}=await db.from("messages")
 .select("id,sender_id,receiver_id,message,created_at")
 .or(
  `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
 )
 .order("created_at",{ascending:true});

 box.innerHTML="";
 if(error){box.textContent=error.message;return;}

 data.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg "+(m.sender_id===currentUser.id?"mine":"");
  const content=document.createElement("div");
  content.textContent=m.message;
  const time=document.createElement("div");
  time.className="time";
  time.textContent=new Date(m.created_at).toLocaleTimeString([],{
   hour:"2-digit",minute:"2-digit"
  });
  div.append(content,time);
  box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}



async function sendMessage(){
 if(!selectedUser){
  alert("Please select a user first.");
  return;
 }

 // Check whether current user is muted
 const {data: mute, error: muteError} = await db
  .from("member_mutes")
  .select("reason, muted_until")
  .eq("user_id", currentUser.id)
  .is("unmuted_at", null)
  .gt("muted_until", new Date().toISOString())
  .order("created_at", {ascending:false})
  .limit(1)
  .maybeSingle();

 if(muteError){
  alert("Mute status check failed: " + muteError.message);
  return;
 }

 if(mute){
  const remaining = Math.max(
   0,
   Math.ceil((new Date(mute.muted_until) - Date.now()) / 60000)
  );

  const hours = Math.floor(remaining / 60);
  const minutes = remaining % 60;

  alert(
   "You are muted!\n" +
   "Reason: " + mute.reason + "\n" +
   "Time remaining: " + hours + "h " + minutes + "m"
  );
  return;
 }

 const input = document.getElementById("message");
 const message = input.value.trim();

 if(!message) return;

 const {error} = await db.from("messages").insert({
  sender_id: currentUser.id,
  receiver_id: selectedUser.id,
  message: message
 });

 if(error){
  alert(error.message);
  return;
 }

 input.value = "";
 await loadMessages();
}

async function logout(){
 if(liveChannel)await db.removeChannel(liveChannel);
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data,error})=>{
 if(error){showStatus(error.message);return;}
 if(data.session)startApp(data.session.user);
});
</script>
</body>
</html>
