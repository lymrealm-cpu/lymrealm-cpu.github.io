
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYM REALM CHAT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(140deg,#06152e,#020817);
 color:#eaf6ff;
 min-height:100vh;
 padding:20px;
}
.container{
 max-width:430px;
 margin:35px auto;
 padding:25px;
 border:1px solid #00bfff;
 border-radius:18px;
 background:#071a32;
 box-shadow:0 0 25px #008cff55;
}
h1{text-align:center;color:#00c8ff}
.tag{text-align:center;color:#9bbbd4}
input,button{
 width:100%;
 padding:14px;
 margin:9px 0;
 border-radius:9px;
}
input{
 background:#020c1b;
 border:1px solid #168ac0;
 color:white;
}
button{
 background:#008cff;
 border:0;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:hover{background:#00bfff}
#status{text-align:center;color:#00d9ff}
.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<h1>👑 LYM REALM CHAT</h1>
<p class="tag">CONNECT • CHAT • PROTECT</p>

<div id="authBox">
<h3>Create Account / Login</h3>

<input id="email" type="email"
placeholder="Email Address">

<input id="password" type="password"
placeholder="Password">

<button onclick="register()">Create Account</button>
Create Account
</button>
<p id="status">Button is working!</p>
<button onclick="login()">Login</button>
</div>

<div id="userBox" class="hidden">
<h3>Welcome to LYM REALM!</h3>
<p id="userEmail"></p>
<button onclick="logout()">Logout</button>
</div>

<p id="status">Welcome to LYM REALM CHAT</p>

</div>

<script>
const SUPABASE_KEY = "sb_publishable_NfTpebCsTJMqaAsh89lfWA_pxv568kr_Key";
const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const statusBox = document.getElementById("status");

async function register(){
alert("REGISTER FUNCTION WORKING!");
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){
statusBox.innerText = "Enter email and password.";
return;
}

if(password.length < 6){
statusBox.innerText = "Password must be 6 characters.";
return;
}

statusBox.innerText = "Creating account...";

try{
const {data,error} = await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){
statusBox.innerText = "Error: " + error.message;
return;
}

statusBox.innerText =
data.session
? "Account created successfully!"
: "Account created! Please verify your email.";

}catch(err){
statusBox.innerText = "Error: " + err.message;
}
}

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){
statusBox.innerText = "Enter email and password.";
return;
}

statusBox.innerText = "Logging in...";

try{
const {data,error} = await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
statusBox.innerText = "Error: " + error.message;
return;
}

showUser(data.user);

}catch(err){
statusBox.innerText = "Error: " + err.message;
}
}

function showUser(user){

document.getElementById("authBox").classList.add("hidden");
document.getElementById("userBox").classList.remove("hidden");

document.getElementById("userEmail").innerText =
"Logged in as: " + user.email;

statusBox.innerText = "Login successful!";
}

async function logout(){

const {error} = await supabaseClient.auth.signOut();

if(error){
statusBox.innerText = error.message;
return;
}

document.getElementById("authBox").classList.remove("hidden");
document.getElementById("userBox").classList.add("hidden");

statusBox.innerText = "You are logged out.";
}

async function checkSession(){

const {data,error} = await supabaseClient.auth.getSession();

if(error){
statusBox.innerText = error.message;
return;
}

if(data.session){
showUser(data.session.user);
}
}

checkSession();

</script>
</body>
</html>
